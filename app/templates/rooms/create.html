{% extends "base.html" %}
{% block title %}Add Room — CampusEvents{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='rooms.css') }}">
{% endblock %}

{% block content %}
<div class="form-page-container">
    <div class="form-header">
        <h1>Add Campus Room</h1>
        <p>Register a room so it can be assigned to events.</p>
    </div>

    <form action="{{ url_for('room.create_room') }}" method="POST" enctype="multipart/form-data" class="create-form">

        <div class="form-section">
            <h4 class="section-title">Room Details</h4>
            <div class="form-group">
                <label for="room_name">Room Name / Number <span class="required">*</span></label>
                <input type="text" id="room_name" name="room_name" placeholder="e.g. Conference Hall B" required>
            </div>
            <div class="form-group">
                <label for="location">Location / Building <span class="required">*</span></label>
                <input type="text" id="location" name="location" placeholder="e.g. Science Building, 3rd Floor" required>
            </div>
            <div class="form-group">
                <label for="capacity">Capacity <span class="required">*</span></label>
                <input type="number" id="capacity" name="capacity" min="1" placeholder="e.g. 80" required>
            </div>
            <div class="form-group">
                <label>Room Image</label>
                <div class="file-upload-area">
                    <input type="file" id="picture" name="picture" accept="image/*" onchange="previewImage(this, 'preview-new')">
                    <div class="file-upload-icon">&#128247;</div>
                    <div class="file-upload-text"><strong>Click to upload</strong> or drag and drop</div>
                    <div class="file-upload-hint">PNG, JPG, GIF or WebP</div>
                </div>
                <div class="file-preview" id="preview-new">
                    <img id="preview-img-new" src="" alt="Preview">
                </div>
            </div>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('room.list_rooms') }}" class="btn-secondary">Cancel</a>
            <button type="submit" class="btn-primary">Save Room</button>
        </div>
    </form>
</div>

<script>
function previewImage(input, previewId) {
    var preview = document.getElementById(previewId);
    var img = preview.querySelector('img');
    if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
            img.src = e.target.result;
            preview.classList.add('has-image');
        };
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
{% endblock %}
