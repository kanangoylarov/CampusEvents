{% extends "base.html" %}
{% block title %}Register — CampusEvents{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='user.css') }}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-avatar">&#128100;</div>
            <h2>Create Account</h2>
            <p>Join the campus community today</p>
        </div>

        <form action="{{ url_for('user.register') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="john@campus.edu" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Min. 8 characters" required>
            </div>
            <div class="form-group">
                <label for="role">Account Type</label>
                <select id="role" name="role">
                    <option value="user">Student / Staff</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>
            <button type="submit" class="btn-auth">Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('user.login') }}">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
