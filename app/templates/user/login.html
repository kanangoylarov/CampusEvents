{% extends "base.html" %}
{% block title %}Login — CampusEvents{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='user.css') }}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-avatar">&#128274;</div>
            <h2>Welcome Back</h2>
            <p>Log in to your CampusEvents account</p>
        </div>

        <form action="{{ url_for('user.login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="john@campus.edu" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-auth">Log In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('user.register_form') }}">Sign up</a>
        </div>
    </div>
</div>
{% endblock %}
