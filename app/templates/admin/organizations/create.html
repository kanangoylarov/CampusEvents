{% extends "admin/base.html" %}
{% block title %}Create Organization{% endblock %}
{% block page_title %}Create Organization{% endblock %}

{% block content %}
<div class="admin-form-card">
    <form method="POST" action="{{ url_for('admin.create_organization') }}" enctype="multipart/form-data" class="create-form">
        <div class="form-section">
            <p class="section-title">Organization Information</p>
            <div class="form-group">
                <label>Name <span class="required">*</span></label>
                <input type="text" name="name" required placeholder="Organization name">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" placeholder="About this organization"></textarea>
            </div>
            <div class="form-group">
                <label>Logo / Banner</label>
                <div class="file-upload-area">
                    <input type="file" name="picture" accept="image/*">
                    <div class="file-upload-icon">&#128247;</div>
                    <div class="file-upload-text"><strong>Click to upload</strong> or drag and drop</div>
                    <div class="file-upload-hint">PNG, JPG, GIF, WebP</div>
                </div>
            </div>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('admin.list_organizations') }}" class="btn-secondary">Cancel</a>
            <button type="submit" class="btn-primary">Create Organization</button>
        </div>
    </form>
</div>
{% endblock %}
