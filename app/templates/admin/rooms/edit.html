{% extends "admin/base.html" %}
{% block title %}Edit Room{% endblock %}
{% block page_title %}Edit Room{% endblock %}

{% block content %}
<div class="admin-form-card">
    <form method="POST" action="{{ url_for('admin.edit_room', id=room.id) }}" enctype="multipart/form-data" class="create-form">
        <div class="form-section">
            <p class="section-title">Room Information</p>
            <div class="form-row">
                <div class="form-group">
                    <label>Room Name / Number <span class="required">*</span></label>
                    <input type="text" name="room_name" required value="{{ room.room_name }}">
                </div>
                <div class="form-group">
                    <label>Capacity</label>
                    <input type="number" name="capacity" min="1" value="{{ room.capacity or '' }}">
                </div>
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" value="{{ room.location or '' }}">
            </div>
            <div class="form-group">
                <label>Image</label>
                {% if room.picture %}
                <div class="current-image">
                    <img src="{{ url_for('static', filename='uploads/' + room.picture) }}" alt="Current image">
                </div>
                {% endif %}
                <div class="file-upload-area">
                    <input type="file" name="picture" accept="image/*">
                    <div class="file-upload-icon">&#128247;</div>
                    <div class="file-upload-text"><strong>Click to upload</strong> new image (optional)</div>
                    <div class="file-upload-hint">PNG, JPG, GIF, WebP</div>
                </div>
            </div>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('admin.list_rooms') }}" class="btn-secondary">Cancel</a>
            <button type="submit" class="btn-primary">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
