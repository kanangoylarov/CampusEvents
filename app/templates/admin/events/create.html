{% extends "admin/base.html" %}
{% block title %}Create Event{% endblock %}
{% block page_title %}Create Event{% endblock %}

{% block content %}
<div class="admin-form-card">
    <form method="POST" action="{{ url_for('admin.create_event') }}" enctype="multipart/form-data" class="create-form">
        <div class="form-section">
            <p class="section-title">Basic Information</p>
            <div class="form-group">
                <label>Event Name <span class="required">*</span></label>
                <input type="text" name="name" required placeholder="Event name">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" placeholder="Event description"></textarea>
            </div>
            <div class="form-group">
                <label>Cover Image</label>
                <div class="file-upload-area">
                    <input type="file" name="picture" accept="image/*">
                    <div class="file-upload-icon">&#128247;</div>
                    <div class="file-upload-text"><strong>Click to upload</strong> or drag and drop</div>
                    <div class="file-upload-hint">PNG, JPG, GIF, WebP</div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <p class="section-title">Date & Time</p>
            <div class="form-group">
                <label>Date <span class="required">*</span></label>
                <input type="date" name="date" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Start Time <span class="required">*</span></label>
                    <input type="time" name="start_time" required>
                </div>
                <div class="form-group">
                    <label>End Time</label>
                    <input type="time" name="end_time">
                </div>
            </div>
        </div>

        <div class="form-section">
            <p class="section-title">Venue & Organizer</p>
            <div class="form-row">
                <div class="form-group">
                    <label>Organization <span class="required">*</span></label>
                    <select name="organization_id" required>
                        <option value="">Select organization</option>
                        {% for org in organizations %}
                        <option value="{{ org.id }}">{{ org.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Room <span class="required">*</span></label>
                    <select name="room_id" required>
                        <option value="">Select room</option>
                        {% for room in rooms %}
                        <option value="{{ room.id }}">{{ room.room_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Capacity</label>
                <input type="number" name="capacity" min="1" placeholder="Max attendees">
            </div>
        </div>

        <div class="form-section">
            <p class="section-title">Settings</p>
            <div class="form-group">
                <label>Registration Link</label>
                <input type="url" name="for_registration" placeholder="https://...">
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="private" value="1">
                    Private event
                </label>
            </div>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('admin.list_events') }}" class="btn-secondary">Cancel</a>
            <button type="submit" class="btn-primary">Create Event</button>
        </div>
    </form>
</div>
{% endblock %}
