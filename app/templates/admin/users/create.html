{% extends "admin/base.html" %}
{% block title %}Create User{% endblock %}
{% block page_title %}Create User{% endblock %}

{% block content %}
<div class="admin-form-card">
    <form method="POST" action="{{ url_for('admin.create_user') }}" class="create-form">
        <div class="form-section">
            <p class="section-title">User Information</p>
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" name="full_name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" name="email" required placeholder="john@example.com">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <input type="password" name="password" required placeholder="Min 6 characters" minlength="6">
                </div>
                <div class="form-group">
                    <label>Role <span class="required">*</span></label>
                    <select name="role">
                        <option value="user">User</option>
                        <option value="organization">Organization</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('admin.list_users') }}" class="btn-secondary">Cancel</a>
            <button type="submit" class="btn-primary">Create User</button>
        </div>
    </form>
</div>
{% endblock %}
