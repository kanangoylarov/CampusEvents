{% extends "admin/base.html" %}
{% block title %}Edit User{% endblock %}
{% block page_title %}Edit User{% endblock %}

{% block content %}
<div class="admin-form-card">
    <form method="POST" action="{{ url_for('admin.edit_user', id=user.id) }}" class="create-form">
        <div class="form-section">
            <p class="section-title">User Information</p>
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" name="full_name" required value="{{ user.full_name }}">
            </div>
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" name="email" required value="{{ user.email }}">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>New Password <small>(leave blank to keep current)</small></label>
                    <input type="password" name="password" placeholder="Leave blank to keep current">
                </div>
                <div class="form-group">
                    <label>Role <span class="required">*</span></label>
                    <select name="role" id="roleSelect" onchange="toggleOrgField()">
                        <option value="user" {% if user.role == 'user' %}selected{% endif %}>User</option>
                        <option value="organization" {% if user.role == 'organization' %}selected{% endif %}>Organization</option>
                        <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                    </select>
                </div>
            </div>
            <div class="form-group" id="orgGroup" style="{% if user.role != 'organization' %}display:none;{% endif %}">
                <label>Organization <span class="required">*</span></label>
                <select name="organization_id" id="orgSelect">
                    <option value="">-- Select Organization --</option>
                    {% for org in organizations %}
                    <option value="{{ org.id }}" {% if user.organization_id == org.id %}selected{% endif %}>{{ org.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('admin.list_users') }}" class="btn-secondary">Cancel</a>
            <button type="submit" class="btn-primary">Save Changes</button>
        </div>
    </form>
</div>
<script>
function toggleOrgField() {
    var role = document.getElementById('roleSelect').value;
    document.getElementById('orgGroup').style.display = role === 'organization' ? '' : 'none';
}
</script>
{% endblock %}
