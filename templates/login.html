<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - CampusEvents</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Login</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('user.login') }}">
            <label>Email Address:</label>
            <input type="email" name="email" placeholder="email@campus.edu" required>
            
            <label>Password:</label>
            <input type="password" name="password" placeholder="••••••••" required>
            
            <button type="submit" class="btn-submit">Enter</button>
        </form>

        <div style="margin-top: 20px; text-align: center;">
            <a href="{{ url_for('user.register') }}">Need an account? Register</a>
        </div>
    </div>
</body>
</html>
