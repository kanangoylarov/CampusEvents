<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Room</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Add New Campus Room</h2>

        <form action="{{ url_for('room.create_room') }}" method="POST">
            <label>Room Name/Number:</label>
            <input type="text" name="room_name" required placeholder="e.g. Conference Hall B">

            <label>Location/Building:</label>
            <input type="text" name="location" required placeholder="e.g. Science Building, 3rd Floor">

            <label>Capacity:</label>
            <input type="number" name="capacity" required placeholder="e.g. 100">

            <label>Room Image URL:</label>
            <input type="text" name="picture" placeholder="http://url-to-image.jpg">

            <button type="submit" class="btn-submit">Save Room</button>
        </form>
        
        <p><a href="{{ url_for('room.list_rooms') }}">View All Rooms</a></p>
    </div>
</body>
</html>
