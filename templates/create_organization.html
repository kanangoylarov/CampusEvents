<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Organization</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Register New Organization</h2>
        <p>Clubs, Departments, or Student Groups</p>

        <form action="{{ url_for('organization.create_organization') }}" method="POST">
            <label>Organization Name:</label>
            <input type="text" name="name" required placeholder="e.g., Coding Club or Sports Dept.">

            <label>Logo/Picture URL:</label>
            <input type="text" name="picture" placeholder="http://link-to-logo.png">

            <label>Description:</label>
            <textarea name="description" rows="5" placeholder="What is the mission of this organization?"></textarea>

            <button type="submit" class="btn-submit">Register Organization</button>
        </form>
        
        <p><a href="{{ url_for('organization.list_organizations') }}">View All Organizations</a></p>
    </div>
</body>
</html>
