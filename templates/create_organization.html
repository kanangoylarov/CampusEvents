<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Organization</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Register New Organization</h2>
        <p style="text-align: center; color: #666;">Clubs, Departments, or Student Groups</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('organization.create_organization') }}" method="POST">
            <label>Organization Name:</label>
            <input type="text" name="name" required placeholder="e.g., Coding Club or Sports Dept.">

            <label>Logo/Picture URL:</label>
            <input type="text" name="picture" placeholder="http://link-to-logo.png">

            <label>Description:</label>
            <textarea name="description" rows="5" required placeholder="What is the mission of this organization?"></textarea>

            <button type="submit" class="btn-submit">Register Organization</button>
        </form>
        
        <div style="margin-top: 20px; text-align: center;">
            <a href="{{ url_for('organization.list_organizations') }}">← View All Organizations</a>
        </div>
    </div>
</body>
</html>
